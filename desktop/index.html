<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}

/* Orbit layout: workspaces and tabs stay beside the page, with a quiet top address bar. */
#app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);height:100%;padding:10px;gap:10px}

.w.on{background:rgba(var(--g),.9);opacity:1;color:var(--accent)}
#ess{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.es{aspect-ratio:1;border-radius:9px;background:rgba(var(--g),.75);color:var(--ink)}
#tw{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:0;flex:1}
#tabs{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-height:0;overflow:auto}
.tab{max-width:none;min-width:0;width:100%;padding:8px 9px;border-radius:9px}
#nt{width:100%;padding:9px;text-align:left}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;gap:9px}
#top{display:flex;align-items:center;gap:4px;flex:none;min-height:50px;padding:5px 8px;border-radius:14px}
#url{height:36px;flex:1;flex-basis:0!important;margin:0 6px;text-align:left;background:rgba(var(--g),.55)}
#tc{display:none}
#view{flex:1;position:relative;min-height:0;min-width:0;border-radius:16px;overflow:hidden;background:rgba(var(--g),.16)}
#home{padding:7vh 24px;align-items:center}
.card{width:min(720px,100%);border-radius:17px;padding:34px 30px}
.home-eyebrow{color:var(--muted);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:15px}
.home-title{font-size:clamp(30px,4vw,44px);line-height:1.1;letter-spacing:-1.2px;margin:0 0 7px;font-weight:600}
.home-subtitle{color:var(--muted);margin:0 0 24px;font-size:14px}

.home-search .search-icon{font-size:19px;color:var(--muted)}
#hs{height:48px;flex:1;width:auto;border:0;background:transparent;text-align:left;padding:0;font-size:15px}
#hs:focus{outline:0}
#sites{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:18px}
.site{flex-direction:row;justify-content:flex-start;text-align:left;padding:10px 12px;border-radius:11px;font-size:12px}
.site .fv{width:28px;height:28px;border-radius:8px;font-size:12px}
#home-settings{margin-top:17px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;cursor:pointer}
html[data-pos=right] #app{grid-template-columns:minmax(0,1fr) var(--sw)}
html[data-pos=right] #side{grid-column:2;grid-row:1}

<body>
<div id="wall"></div><div id="dim"></div>

      <input id="url" type="text" placeholder="Search DuckDuckGo or enter address" aria-label="Address bar" autocapitalize="off" autocomplete="off">
      <button class="ib" id="star" aria-label="Bookmark this page">☆</button><button class="ib" id="tc" aria-label="Show tabs">1</button><button class="ib" id="gear" aria-label="Customize">⚙</button><button class="ib" id="hide" aria-label="Hide sidebar">⇤</button>
    </div><div id="view"></div>
  </main>
</div>

<aside id="set" aria-label="Customize" aria-hidden="true">
<h2>Customize <button class="ib" id="close" aria-label="Close">✕</button></h2>
<h3>SEARCH ENGINE</h3><div class="row" id="engines"></div>

<h3>WALLPAPER</h3><div class="row" id="presets"></div>
<div class="row" style="margin-top:10px"><button class="chip" id="upl">Upload photo</button><input type="file" id="file" accept="image/*" hidden><input type="color" id="solid" aria-label="Solid color wallpaper" value="#2a2f55"></div>
<label>Darken <span id="dv"></span></label><input type="range" id="dim_r" min="0" max="70">
<label>Blur <span id="bv"></span></label><input type="range" id="blur_r" min="0" max="20">

<label>Spacing <span id="pv"></span></label><input type="range" id="gap_r" min="0" max="16">
<label>Glass opacity <span id="gv"></span></label><input type="range" id="glass_r" min="15" max="96">
<h3>ACCENT COLOR</h3><div class="row" id="accents"></div>

<h3>START PAGE</h3>
<input type="text" id="name" placeholder="Your name" aria-label="Your name">
<div class="row" style="margin-top:10px"><button class="chip" id="clk">Show clock</button><button class="chip" id="reset">Reset all</button></div>
<div id="st" role="status"></div>
</aside>
