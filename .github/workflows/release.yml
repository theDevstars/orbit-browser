name: Build and release Orbit Browser

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install JavaScript dependencies
        run: npm install --legacy-peer-deps
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build installable APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build Windows installers
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build EXE packages
        run: npm run dist
      - name: Save EXE packages
        uses: actions/upload-artifact@v4
        with:
          name: orbit-windows-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: orbit-android-apk
          path: release-assets
      - name: Download Windows EXE packages
        uses: actions/download-artifact@v4
        with:
          name: orbit-windows-exe
          path: release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Orbit Browser v0.1.${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: release-assets/**/*
